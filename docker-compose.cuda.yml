# NVIDIA CUDA stack (optional). Primary deployment uses docker-compose.yml (ROCm).
# Host ports: 8101 gateway; 8201–8204 direct vLLM backends (8202–8204 require --profile full-stack).
#
# Default: gateway + qwen-main only. Full four backends: docker compose -f docker-compose.cuda.yml --profile full-stack up -d
name: cognicore-vllm-cuda

x-vllm-base: &vllm-base
  image: vllm/vllm-openai:latest
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - ./hf_cache:/root/.cache/huggingface
  healthcheck:
    test:
      [
        "CMD-SHELL",
        'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'').read()"',
      ]
    interval: 30s
    timeout: 10s
    retries: 60
    start_period: 1200s

services:
  gateway:
    build:
      context: ./gateway
    env_file:
      - .env
    environment:
      GATEWAY_PORT: "8101"
      GATEWAY_TIMEOUT_SECONDS: ${GATEWAY_TIMEOUT_SECONDS}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL}
      GATEWAY_RATE_LIMIT_RPM: ${GATEWAY_RATE_LIMIT_RPM:-120}
      GATEWAY_TRUST_X_FORWARDED_FOR: ${GATEWAY_TRUST_X_FORWARDED_FOR:-false}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-}
      QWEN_MAIN_ALIAS: ${QWEN_MAIN_ALIAS}
      CODER_ALIAS: ${CODER_ALIAS}
      DEEPSEEK_ALIAS: ${DEEPSEEK_ALIAS}
      BGE_ALIAS: ${BGE_ALIAS}
      QWEN_MAIN_MODEL: ${QWEN_MAIN_MODEL}
      CODER_MODEL: ${CODER_MODEL}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      BGE_MODEL: ${BGE_MODEL}
    ports:
      - "8101:8101"
    depends_on:
      qwen-main-vllm:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8101/health'').read()"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  qwen-main-vllm:
    <<: *vllm-base
    gpus: all
    ports:
      - "8201:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: ${HF_HOME}
      CUDA_VISIBLE_DEVICES: ${QWEN_MAIN_CUDA_VISIBLE_DEVICES:-0}
    command: >
      ${QWEN_MAIN_MODEL}
      --host 0.0.0.0
      --port 8000
      --served-model-name ${QWEN_MAIN_ALIAS}
      --tensor-parallel-size ${QWEN_MAIN_TP}
      --max-model-len ${QWEN_MAIN_MAX_MODEL_LEN}
      --gpu-memory-utilization ${QWEN_MAIN_GPU_MEMORY_UTILIZATION}
      --dtype ${QWEN_MAIN_DTYPE}
      --trust-remote-code

  coder-vllm:
    <<: *vllm-base
    profiles:
      - full-stack
    gpus: all
    ports:
      - "8202:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: ${HF_HOME}
      CUDA_VISIBLE_DEVICES: ${CODER_CUDA_VISIBLE_DEVICES:-1}
    command: >
      ${CODER_MODEL}
      --host 0.0.0.0
      --port 8000
      --served-model-name ${CODER_ALIAS}
      --tensor-parallel-size ${CODER_TP}
      --max-model-len ${CODER_MAX_MODEL_LEN}
      --gpu-memory-utilization ${CODER_GPU_MEMORY_UTILIZATION}
      --dtype ${CODER_DTYPE}
      --trust-remote-code

  deepseek-vllm:
    <<: *vllm-base
    profiles:
      - full-stack
    gpus: all
    ports:
      - "8203:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: ${HF_HOME}
      CUDA_VISIBLE_DEVICES: ${DEEPSEEK_CUDA_VISIBLE_DEVICES:-2}
    command: >
      ${DEEPSEEK_MODEL}
      --host 0.0.0.0
      --port 8000
      --served-model-name ${DEEPSEEK_ALIAS}
      --tensor-parallel-size ${DEEPSEEK_TP}
      --max-model-len ${DEEPSEEK_MAX_MODEL_LEN}
      --gpu-memory-utilization ${DEEPSEEK_GPU_MEMORY_UTILIZATION}
      --dtype ${DEEPSEEK_DTYPE}
      --trust-remote-code

  bge-large-vllm:
    <<: *vllm-base
    profiles:
      - full-stack
    gpus: all
    ports:
      - "8204:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: ${HF_HOME}
      CUDA_VISIBLE_DEVICES: ${BGE_CUDA_VISIBLE_DEVICES:-3}
    command: >
      ${BGE_MODEL}
      --host 0.0.0.0
      --port 8000
      --served-model-name ${BGE_ALIAS}
      --tensor-parallel-size ${BGE_TP}
      --max-model-len ${BGE_MAX_MODEL_LEN}
      --gpu-memory-utilization ${BGE_GPU_MEMORY_UTILIZATION}
      --dtype ${BGE_DTYPE}
      --trust-remote-code
