# Primary stack: AMD ROCm + vLLM OpenAI server image.
# For NVIDIA CUDA, use: docker compose -f docker-compose.cuda.yml ...
#
# Host ports (localhost):
#   8101 — gateway (unified /v1)
#   8201 — qwen-main-vllm (direct OpenAI API on container :8000)
#   8202–8204 — coder / deepseek / bge (only with --profile full-stack)
#
# Default (no profile): gateway + **qwen-main only** — enough for CogniScribe summarization via alias qwen-main.
# All four backends: docker compose --profile full-stack up -d
#
# HIP: use QWEN_MAIN_HIP_VISIBLE_DEVICES etc. in .env. Listing non-existent GPU indices (e.g. 0–3 on a 1-GPU
# host) makes ROCm report **No HIP GPUs** and the gateway returns 502 "Upstream model service unavailable".
name: cognicore-vllm

x-vllm-base: &vllm-base
  image: vllm/vllm-openai-rocm:latest
  restart: unless-stopped
  env_file:
    - .env
  devices:
    - /dev/kfd
    - /dev/dri
  group_add:
    - video
    - render
  security_opt:
    - seccomp=unconfined
  ipc: host
  shm_size: "16g"
  volumes:
    - ./hf_cache:/root/.cache/huggingface
  healthcheck:
    test:
      [
        "CMD-SHELL",
        'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'').read()"',
      ]
    interval: 30s
    timeout: 10s
    retries: 60
    start_period: 1200s

services:
  gateway:
    build:
      context: ./gateway
    env_file:
      - .env
    environment:
      # Must match container listen port (see gateway Dockerfile / uvicorn --port 8101).
      GATEWAY_PORT: "8101"
      GATEWAY_TIMEOUT_SECONDS: ${GATEWAY_TIMEOUT_SECONDS}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL}
      GATEWAY_RATE_LIMIT_RPM: ${GATEWAY_RATE_LIMIT_RPM:-120}
      GATEWAY_TRUST_X_FORWARDED_FOR: ${GATEWAY_TRUST_X_FORWARDED_FOR:-false}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-}
      QWEN_MAIN_ALIAS: ${QWEN_MAIN_ALIAS}
      CODER_ALIAS: ${CODER_ALIAS}
      DEEPSEEK_ALIAS: ${DEEPSEEK_ALIAS}
      BGE_ALIAS: ${BGE_ALIAS}
      QWEN_MAIN_MODEL: ${QWEN_MAIN_MODEL}
      CODER_MODEL: ${CODER_MODEL}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      BGE_MODEL: ${BGE_MODEL}
    ports:
      # Public OpenAI-compatible API (vLLM access): always http://<host>:8101/v1
      - "8101:8101"
    depends_on:
      qwen-main-vllm:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8101/health'').read()"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  qwen-main-vllm:
    <<: *vllm-base
    # ROCm-in-Docker: without this, some hosts show torch.cuda.is_available()==False / "No HIP GPUs"
    # in the engine subprocess and the gateway gets 502 (connection refused to :8000).
    privileged: true
    ports:
      - "8201:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: ${HF_HOME}
      HIP_VISIBLE_DEVICES: ${QWEN_MAIN_HIP_VISIBLE_DEVICES:-0}
    # Image ENTRYPOINT is already `vllm serve`; only pass model id + flags.
    command: >
      ${QWEN_MAIN_MODEL}
      --host 0.0.0.0
      --port 8000
      --served-model-name ${QWEN_MAIN_ALIAS}
      --tensor-parallel-size ${QWEN_MAIN_TP}
      --max-model-len ${QWEN_MAIN_MAX_MODEL_LEN}
      --gpu-memory-utilization ${QWEN_MAIN_GPU_MEMORY_UTILIZATION}
      --dtype ${QWEN_MAIN_DTYPE}
      --trust-remote-code
      --enforce-eager

  coder-vllm:
    <<: *vllm-base
    profiles:
      - full-stack
    ports:
      - "8202:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: ${HF_HOME}
      HIP_VISIBLE_DEVICES: ${CODER_HIP_VISIBLE_DEVICES:-1}
    command: >
      ${CODER_MODEL}
      --host 0.0.0.0
      --port 8000
      --served-model-name ${CODER_ALIAS}
      --tensor-parallel-size ${CODER_TP}
      --max-model-len ${CODER_MAX_MODEL_LEN}
      --gpu-memory-utilization ${CODER_GPU_MEMORY_UTILIZATION}
      --dtype ${CODER_DTYPE}
      --trust-remote-code

  deepseek-vllm:
    <<: *vllm-base
    profiles:
      - full-stack
    ports:
      - "8203:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: ${HF_HOME}
      HIP_VISIBLE_DEVICES: ${DEEPSEEK_HIP_VISIBLE_DEVICES:-2}
    command: >
      ${DEEPSEEK_MODEL}
      --host 0.0.0.0
      --port 8000
      --served-model-name ${DEEPSEEK_ALIAS}
      --tensor-parallel-size ${DEEPSEEK_TP}
      --max-model-len ${DEEPSEEK_MAX_MODEL_LEN}
      --gpu-memory-utilization ${DEEPSEEK_GPU_MEMORY_UTILIZATION}
      --dtype ${DEEPSEEK_DTYPE}
      --trust-remote-code

  bge-large-vllm:
    <<: *vllm-base
    profiles:
      - full-stack
    ports:
      - "8204:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: ${HF_HOME}
      HIP_VISIBLE_DEVICES: ${BGE_HIP_VISIBLE_DEVICES:-3}
    command: >
      ${BGE_MODEL}
      --host 0.0.0.0
      --port 8000
      --served-model-name ${BGE_ALIAS}
      --tensor-parallel-size ${BGE_TP}
      --max-model-len ${BGE_MAX_MODEL_LEN}
      --gpu-memory-utilization ${BGE_GPU_MEMORY_UTILIZATION}
      --dtype ${BGE_DTYPE}
      --trust-remote-code
